[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "twittrapi"
dynamic = ["version"]
description = "Python client for TwittrAPI: read public Twitter/X tweets, profiles, followers and search results, and act with your own X account. Pay as you go from $0.065 per 1,000 calls."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "TwittrAPI" }]
keywords = ["twitter api", "x api", "twitter scraper", "tweets", "twitter search", "twitter followers", "social media data", "twittrapi", "sdk", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.23.0,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "mypy>=1.5"]

[project.urls]
Homepage = "https://twittrapi.com"
Documentation = "https://twittrapi.com"
Source = "https://github.com/twittrapi/twittrapi-python"
Issues = "https://github.com/twittrapi/twittrapi-python/issues"
Changelog = "https://github.com/twittrapi/twittrapi-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/twittrapi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/twittrapi"]

[tool.hatch.build.targets.sdist]
include = ["src/twittrapi", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/twittrapi"]
